services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: atlas_python
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_python"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - atlas_python_pg:/var/lib/postgresql/data

  api:
    build: .
    environment:
      ATLAS_ENV: development
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas_python
      ATLAS_JWT_SECRET: local-development-secret-change-before-production
      ATLAS_WEB_ORIGIN: http://127.0.0.1:5173
      ATLAS_COOKIE_SECURE: "false"
    command: ["sh", "-c", "alembic upgrade head && uvicorn atlas_api.main:app --host 0.0.0.0 --port 8790 --reload"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - .:/app

  worker:
    build: .
    environment:
      ATLAS_ENV: development
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas_python
      ATLAS_JWT_SECRET: local-development-secret-change-before-production
      ATLAS_WEB_ORIGIN: http://127.0.0.1:5173
      ATLAS_COOKIE_SECURE: "false"
    command: ["sh", "-c", "alembic upgrade head && python -m atlas_api.worker"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  atlas_python_pg:
